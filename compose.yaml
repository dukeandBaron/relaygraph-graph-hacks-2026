services:
  graph:
    platform: linux/amd64
    image: falkordb/falkordb@sha256:d998ed0dfd91da6208f257dfd61f5330335bd6e7006cfc0fd1ddd761269e2634
    ports:
      - "127.0.0.1:6388:6379"
    volumes:
      - ./runtime/graph-data:/data
    command: ["redis-server", "--loadmodule", "/var/lib/falkordb/bin/falkordb.so", "--dir", "/data", "--appendonly", "yes", "--save", "60", "1"]
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
